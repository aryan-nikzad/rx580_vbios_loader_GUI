name: RX580 ReBAR DXE build check

on:
  push:
    branches:
      - experiment/rx580-rebar-pre-enumeration
  pull_request:
    paths:
      - "experimental/rx580-rebar-dxe/early/**"
      - "tools/compare_rebar.py"
      - "tools/read_rebar_efi_log.py"
      - ".github/workflows/rx580-rebar-checks.yml"
  workflow_dispatch:

jobs:
  build-edk2-driver:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout loader repository
        uses: actions/checkout@v4

      - name: Checkout EDK2
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202502
          submodules: false
          path: edk2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gnu-efi uuid-dev nasm acpica-tools python3-venv

      - name: Build loader including late ECAM ReBAR fallback
        run: make clean && make

      - name: Install EDK2 Python requirements and build BaseTools
        shell: bash
        run: |
          set -euxo pipefail
          cd edk2
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r pip-requirements.txt
          git submodule update --init --depth 1 BaseTools/Source/C/BrotliCompress/brotli
          git submodule update --init --depth 1 MdePkg/Library/MipiSysTLib/mipisyst
          make -C BaseTools
          echo "$GITHUB_WORKSPACE/edk2/.venv/bin" >> "$GITHUB_PATH"

      - name: Build DXE module
        shell: bash
        run: |
          set -euxo pipefail
          cd edk2
          export PACKAGES_PATH="$GITHUB_WORKSPACE/edk2:$GITHUB_WORKSPACE"
          export WORKSPACE="$GITHUB_WORKSPACE/edk2"
          export PYTHON_COMMAND=python3
          set +u
          source edksetup.sh
          set -u
          build -p "$GITHUB_WORKSPACE/experimental/rx580-rebar-dxe/early/Rx580ReBarEarly.dsc" -a X64 -t GCC5 -b DEBUG

      - name: Package built DXE module as FFS
        shell: bash
        run: |
          set -euxo pipefail
          cd edk2
          export PACKAGES_PATH="$GITHUB_WORKSPACE/edk2:$GITHUB_WORKSPACE"
          source edksetup.sh
          DXE="$(find Build/Rx580ReBarEarly -type f -name Rx580ReBarEarlyDxe.efi -print -quit)"
          test -n "$DXE"
          BUILD_DIR="$(dirname "$DXE")"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          GenSec -o "$BUILD_DIR/Rx580ReBarEarlyDxe.pe32.sec" "$DXE" -S EFI_SECTION_PE32
          GenSec -o "$BUILD_DIR/Rx580ReBarEarlyDxe.name.sec" -S EFI_SECTION_USER_INTERFACE -n "RX580 ReBAR Early DXE"
          GenFfs -g 5d4c6f81-70c0-49a6-962b-440e58119271 -o "$GITHUB_WORKSPACE/artifacts/Rx580ReBarEarlyDxe.ffs" -i "$BUILD_DIR/Rx580ReBarEarlyDxe.pe32.sec" -i "$BUILD_DIR/Rx580ReBarEarlyDxe.name.sec" -t EFI_FV_FILETYPE_DRIVER --checksum

      - name: Upload DXE FFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx580-rebar-early-dxe-ffs
          path: artifacts/Rx580ReBarEarlyDxe.ffs
          if-no-files-found: error

      - name: Syntax-check diagnostic tools
        run: python3 -m py_compile tools/compare_rebar.py tools/read_rebar_efi_log.py

      - name: Syntax-check build helper
        run: sh -n experimental/rx580-rebar-dxe/early/build_in_edk2.sh
